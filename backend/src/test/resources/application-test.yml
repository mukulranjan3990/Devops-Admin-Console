server:
  port: 8081

spring:
  application:
    name: three-tier-backend-test

  datasource:
    url: jdbc:h2:mem:adminportal-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt-secret: test-jwt-secret-key-for-unit-testing-32-bytes-minimum!
  version: 1.0.0-TEST
  cors-allowed-origins: "*"

management:
  endpoint:
    health:
      probes:
        enabled: true
