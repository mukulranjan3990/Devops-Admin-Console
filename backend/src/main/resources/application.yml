server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: three-tier-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  

  datasource:
    url: jdbc:mysql://${RDS_HOSTNAME:localhost}:${RDS_PORT:3306}/${RDS_DB_NAME:adminportal}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${RDS_USERNAME:root}
    password: ${RDS_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true        #by default it was flase, but I have changed it to true for debugging purpose, you can change it back to false in production
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt-secret: ${JWT_SECRET:devops-three-tier-secret-key-2026-change-in-prod-env}
  version: ${APP_VERSION:1.0.0}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always


