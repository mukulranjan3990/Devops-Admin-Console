
name: Frontend CI Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend


    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      # I am  using Vitest/Jest, run your tests here
      - name: Install dependencies & Run Tests
        run: |
          npm ci
          npm run test -- --watchAll=false || echo "No tests configured yet"

      - name: Lint code
        run: |
          npm run lint || echo "No linting configured yet"
      
      # Sonar scanner step (optional, if you have SonarQube configured)
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.F_SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=devops-console-admin-checks
            -Dsonar.projectKey=devops-console-admin-checks_frontend-checks
            -Dsonar.sources=.
            -Dsonar.qualitygate.wait=true
            -Dsonar.exclusions=backend/**,node_modules/**,build/**
            -Dsonar.branch.name=${{ github.ref_name }}
    
       # -Dsonar.tests=./frontend/src
       # -Dsonar.host.url=https://sonarcloud.io

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-devops-admin-console
          tags: |
            type=raw,value=${{ github.run_number }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
     
      - name: Validate Docker Hub username
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::DOCKERHUB_USERNAME secret is missing or empty."
            exit 1
          fi
          echo "Docker Hub username secret is configured."
