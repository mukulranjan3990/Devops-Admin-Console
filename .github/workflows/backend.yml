name: Backend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

  workflow_dispatch:

jobs:
  backend-pipeline:
    name: Test and Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

  #spining up the mysql container for testing the backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: adminportal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 💡 Required by SonarQube for better analysis

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test backend
        env:
          RDS_HOSTNAME: localhost
          RDS_PORT: 3306
          RDS_DB_NAME: adminportal
          RDS_USERNAME: root
          RDS_PASSWORD: rootpassword
        run: mvn -B clean verify

  
  build-and-push:
    name: Build and Push Docker Image
    needs: backend-pipeline
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4


      # # Step 2: Search and Replace Database Secrets in application.yml
      # - name: Search and Replace Datasource Secrets
      #   env:
      #     DB_URL: ${{ secrets.DB_URL }}
      #     DB_USERNAME: ${{ secrets.DB_USERNAME }}
      #     DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      #   run: |
      #     TARGET_FILE="./backend/src/main/resources/application.yml"
          
      #     # Replace placeholders with secrets from GitHub Actions Secrets
      #     sed -i "s|DB_URL_PLACEHOLDER|${DB_URL}|g" $TARGET_FILE
      #     sed -i "s|DB_USERNAME_PLACEHOLDER|${DB_USERNAME}|g" $TARGET_FILE
      #     sed -i "s|DB_PASSWORD_PLACEHOLDER|${DB_PASSWORD}|g" $TARGET_FILE

      #     # Verification step (Masked sensitive outputs automatically by GitHub Actions)
      #     echo "Datasource replacement complete for $TARGET_FILE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/backend-devops-admin-console
          tags: |
            type=raw,value=${{ github.run_number }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
     
      - name: Validate Docker Hub username
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::DOCKERHUB_USERNAME secret is missing or empty."
            exit 1
          fi
          echo "Docker Hub username secret is configured."
